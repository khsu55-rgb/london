<style>/* required styles */

.leaflet-pane,

<style>:root{
  --navy:#0E2240;--navy2:#1B3A66;--red:#C8102E;--red2:#A30D25;--cream:#F6F2E9;--paper:#FFFFFF;
  --gold:#C9A227;--ink:#16181D;--muted:#5E6673;--line:#E4DED1;--green:#1E7A4C;--amber:#B26B00;--blue:#1D5FBF;
  --r:16px;--sh:0 1px 2px rgba(14,34,64,.06),0 4px 14px rgba(14,34,64,.07);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--cream);color:var(--ink)}
body{font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;font-size:15.5px;line-height:1.65;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.app{max-width:600px;margin:0 auto;padding-bottom:calc(84px + var(--safe-b))}

/* header */
.hdr{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;border-bottom:4px solid var(--red);box-shadow:0 2px 10px rgba(0,0,0,.15)}
.hdr-in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px}
.logo{width:38px;height:38px;flex:0 0 38px;border-radius:10px;background:var(--red);display:grid;place-items:center}
.hdr h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
.hdr .sub{font-size:12.5px;opacity:.82}
.hdr .clock{margin-inline-start:auto;text-align:left;font-size:12px;opacity:.95;line-height:1.35}
.hdr .clock b{font-size:17px;display:block;font-variant-numeric:tabular-nums}

/* nav */
.nav{position:fixed;bottom:0;inset-inline:0;z-index:60;background:#fff;border-top:1px solid var(--line);padding-bottom:var(--safe-b);box-shadow:0 -4px 16px rgba(14,34,64,.08)}
.nav-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{background:none;border:0;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);cursor:pointer;min-height:60px}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--red);font-weight:700}
.nav button.on svg{stroke:var(--red)}

/* layout */
.view{display:none;padding:14px}
.view.on{display:block}
.sec-t{font-size:13px;font-weight:700;color:var(--navy2);margin:18px 2px 8px;display:flex;align-items:center;gap:6px}
.card{background:var(--paper);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:12px;border:1px solid #EFE9DC}
.card.navy{background:linear-gradient(160deg,var(--navy),var(--navy2));color:#fff;border:0}
.card.navy .muted{color:#C9D4E8}
.card.warn{border-inline-start:5px solid var(--amber)}
.card.tip{background:#FFF9EC;border-color:#F1E3BF}
.muted{color:var(--muted);font-size:13.5px}
.small{font-size:12.5px}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.sp{flex:1}
h2{font-size:19px;margin:0 0 4px;line-height:1.4}
h3{font-size:16px;margin:0 0 4px;line-height:1.45}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 9px;border-radius:999px;background:#EEF2F8;color:var(--navy2);white-space:nowrap;font-weight:500}
.pill.red{background:#FCE8EB;color:var(--red2)}
.pill.green{background:#E3F4EA;color:var(--green)}
.pill.amber{background:#FDF0DA;color:var(--amber)}
.pill.gold{background:#FBF3D9;color:#7A5E00}
.pill.gray{background:#F0EEE9;color:#5E6673}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer;min-height:44px;background:var(--red);color:#fff;text-decoration:none}
.btn.sec{background:#EEF2F8;color:var(--navy)}
.btn.ghost{background:transparent;color:var(--navy2);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;min-height:36px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13.5px;cursor:pointer;white-space:nowrap;min-height:38px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip b{font-weight:700}

/* now */
.now-time{font-size:12.5px;opacity:.85}
.now-big{font-size:21px;font-weight:700;margin:6px 0 2px;line-height:1.35}
.prog{height:6px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden;margin:10px 0 4px}
.prog i{display:block;height:100%;background:var(--gold);border-radius:6px}
.count{font-variant-numeric:tabular-nums;font-weight:700}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qa button{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 4px;font-size:13px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:72px;box-shadow:var(--sh)}
.qa button span{font-size:22px;line-height:1}

/* timeline */
.tl{position:relative;padding-inline-start:20px}
.tl:before{content:"";position:absolute;inset-inline-start:7px;top:6px;bottom:6px;width:2px;background:#DCD4C3}
.it{position:relative;margin-bottom:12px}
.it .dot{position:absolute;inset-inline-start:-19px;top:16px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--navy2)}
.it.k-meal .dot{border-color:var(--gold)}
.it.k-rest .dot{border-color:#9AA3AF}
.it.k-wife .dot{border-color:#B44C8A}
.it.k-info .dot{border-color:#9AA3AF}
.it.done{opacity:.55}
.it.done .dot{background:var(--green);border-color:var(--green)}
.it.cur .card{outline:2px solid var(--red)}
.it .tm{font-variant-numeric:tabular-nums;font-weight:700;color:var(--navy2);font-size:13px}
.opts li{margin-bottom:6px}
.stops{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.stops button{border:1px solid var(--line);background:#FBFAF7;border-radius:10px;padding:5px 9px;font-size:12.5px;cursor:pointer}

/* place cards */
.pc{display:flex;gap:10px;align-items:flex-start}
.pc .ic{width:40px;height:40px;flex:0 0 40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:#F3EFE6}
.pc .bd{flex:1;min-width:0}
.pc h4{margin:0;font-size:15px;line-height:1.4}
.pc .en{font-size:12px;color:var(--muted);direction:ltr;text-align:right}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.why{font-size:13.5px;margin-top:6px;color:#2A2F38}
.why b{color:var(--navy2)}
.fr{background:#FFF8E6;border:1px solid #F0DFB1;border-radius:10px;padding:8px 10px;margin-top:8px;font-size:13px}
.fr .pros{color:var(--green)}
.fr .cons{color:#A23B2A}
.opt-card{border:1px solid var(--line);border-radius:14px;padding:11px;margin-top:8px;background:#fff}
.opt-card.best{border-color:var(--gold);box-shadow:0 0 0 2px #F5E7B5 inset}

/* map */
#map{height:calc(100vh - 230px);min-height:360px;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);direction:ltr}
.mk{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.mk span{transform:rotate(45deg);font-size:14px}
.mk.n{width:26px;height:26px}
.me{width:16px;height:16px;border-radius:50%;background:#1D5FBF;border:3px solid #fff;box-shadow:0 0 0 6px rgba(29,95,191,.25)}
.leaflet-popup-content{direction:rtl;text-align:right;font-family:inherit;margin:10px 12px}
.leaflet-popup-content h4{margin:0 0 4px;font-size:14px}
.mapbar{display:flex;gap:8px;margin-bottom:10px;align-items:center}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,40,.45);z-index:90;display:none}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:100;background:var(--cream);border-radius:20px 20px 0 0;max-height:88vh;overflow:auto;transform:translateY(100%);transition:transform .25s ease;max-width:600px;margin:0 auto;padding-bottom:calc(16px + var(--safe-b))}
.sheet{visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s}
.sheet.on{transform:none;visibility:visible;transition:transform .25s ease,visibility 0s}
.sheet-bg.on{display:block}
.sheet-h{position:sticky;top:0;background:var(--cream);padding:12px 14px 8px;display:flex;align-items:center;gap:8px;z-index:2;border-bottom:1px solid var(--line)}
.sheet-h .grab{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:42px;height:4px;border-radius:4px;background:#CFC6B4}
.sheet-h h3{margin:6px 0 0;font-size:17px}
.sheet-b{padding:12px 14px}
.x{margin-inline-start:auto;background:#fff;border:1px solid var(--line);width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer}

/* lists */
.lst{list-style:none;margin:0;padding:0}
.lst li{padding:10px 0;border-bottom:1px solid #EFE9DC}
.lst li:last-child{border-bottom:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#fff;border:1px solid #EFE9DC;border-radius:16px;padding:14px;box-shadow:var(--sh);cursor:pointer;text-align:right;min-height:96px;display:flex;flex-direction:column;gap:4px}
.tile .e{font-size:24px}
.tile b{font-size:14.5px}
.tile span{font-size:12px;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;min-height:44px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:8px 6px;border-bottom:1px solid #EFE9DC;text-align:right}
table.t td.n{font-variant-numeric:tabular-nums;direction:ltr;text-align:left}
.pray-next{background:#E9F4EE}
.wx{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.wx div{background:#fff;border:1px solid #EFE9DC;border-radius:14px;padding:8px;text-align:center;font-size:12.5px}
.wx div b{display:block;font-size:20px}
.hrs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.hrs div{flex:0 0 54px;background:#fff;border:1px solid #EFE9DC;border-radius:12px;padding:6px 2px;text-align:center;font-size:11.5px}
.chat{display:flex;flex-direction:column;gap:8px}
.msg{padding:10px 12px;border-radius:14px;max-width:92%;white-space:pre-wrap;font-size:14.5px}
.msg.u{background:var(--navy);color:#fff;align-self:flex-start}
.msg.a{background:#fff;border:1px solid var(--line);align-self:flex-end}
.toast{position:fixed;bottom:calc(92px + var(--safe-b));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:200;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid #C9C1AE;background:#fff;display:grid;place-items:center;cursor:pointer;flex:0 0 26px;font-size:15px;color:#fff}
.chk.on{background:var(--green);border-color:var(--green)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
details summary{cursor:pointer;font-weight:600;color:var(--navy2);padding:4px 0;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary:before{content:"▸ ";color:var(--red)}
details[open] summary:before{content:"▾ "}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.banner{background:var(--red);color:#fff;border-radius:14px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
</style>
</head>
<body>
<div class="app">
  <header class="hdr"><div class="hdr-in">
    <div class="logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16M8 18l-2 3M16 18l2 3"/><circle cx="8.5" cy="14.5" r=".6" fill="#fff"/><circle cx="15.5" cy="14.5" r=".6" fill="#fff"/></svg></div>
    <div><h1>رحلتنا — لندن ومانشستر</h1><div class="sub" id="hsub"></div></div>
    <div class="clock" id="hclock"></div>
  </div></header>

  <main>
    <section class="view" id="v-now"></section>
    <section class="view" id="v-plan"></section>
    <section class="view" id="v-map"></section>
    <section class="view" id="v-places"></section>
    <section class="view" id="v-more"></section>
  </main>
</div>

<nav class="nav"><div class="nav-in">
  <button data-t="now"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>الآن</button>
  <button data-t="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>الخطة</button>
  <button data-t="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>الخريطة</button>
  <button data-t="places"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>الأماكن</button>
  <button data-t="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>المزيد</button>
</div></nav>

<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-h"><span class="grab"></span><h3 id="sheet-t"></h3><button class="x" data-act="close" aria-label="إغلاق">✕</button></div>
  <div class="sheet-b" id="sheet-b"></div>
</div>
<div class="toast" id="toast"></div>

الزوجة: تحب جمال القصور الفخمة والعمارة الحديثة البسيطة لكن لا تحب سرد التاريخ، تحب الأسواق الشعبية والهاند ميد والمحلات الفريدة، المقاهي المشهورة الجميلة وشاي العصر، مشي متوسط.

    if (it.alt && it.alt.length) body += `<details style="margin-top:8px"><summary>بدائل قريبة إن تعبتم أو تغيّر الطقس</summary>${it.alt.map(id => placeCard(P[id], { origin })).join('')}</details>`;
    body += `</div>`;
    if (p) prevP = p;
    return `<div class="it k-${it.kind} ${done ? 'done' : ''} ${i === curI ? 'cur' : ''}"><span class="dot"></span>${body}</div>`;
  }).join('') + `</div>`;
  v.innerHTML = h;
  const on = $('#daychips .on'); if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' });
}

let MAP = null, MLAYER = null, MEMK = null, MF = 'day', MDAY = null;

}
function mk(p, small) {

function renderMap() {
  const v = $('#v-map');
  if (!v.dataset.ok) {
    v.innerHTML = `<div class="chips" id="mfchips"></div><div id="map"></div><div class="row" style="margin-top:8px"><button class="btn sm sec" data-act="locate">📍 موقعي</button><span class="sp"></span>${Object.keys(CITY).map(k => `<button class="btn sm ghost" data-act="mapcity" data-c="${k}">${CITY[k].n}</button>`).join('')}</div><div class="muted small" style="margin-top:6px">الخطوط تربط محطات اليوم بالترتيب (ليست مسار طريق). اضغط أي علامة للتفاصيل.</div>`;

  const tset = { eat: ['food', 'cafe', 'tea'], see: ['sight', 'park', 'museum'], shop: ['shop', 'market'], mosque: ['mosque'] };
  let pts = [];
  if (MF === 'day') {
    const day = DAYS.find(d => d.d === MDAY); const ids = [];
    day.items.forEach(it => { if (it.p) ids.push(it.p); (it.stops || []).forEach(s => ids.push(s)); });
    const seq = []; ids.forEach(id => { const p = P[id]; if (p && p.lat != null && !seq.includes(p)) seq.push(p); });
    seq.forEach((p, i) => mk(p).addTo(MLAYER));
    const route = seq.map(p => [p.lat, p.lng]);
    if (route.length > 1) L.polyline(route, { color: '#C8102E', weight: 3, opacity: .7, dashArray: '6 6' }).addTo(MLAYER);
    day.items.forEach(it => { if (it.meal) it.meal.opts.forEach(id => { const p = P[id]; if (p && p.lat != null) mk(p, true).addTo(MLAYER); }); });
    const core = seq.filter(p => !['transit', 'hotel'].includes(p.t));
    pts = (core.length >= 2 ? core : seq).map(p => [p.lat, p.lng]);
  } else {

    const c = CITY[dayCityNow()]; MAP.setView([c.lat, c.lng], c.z);
  }
  if (MYPOS) { MEMK = L.marker([MYPOS.lat, MYPOS.lng], { icon: L.divIcon({ className: '', html: '<div class="me"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }) }).addTo(MLAYER); }

  const byC = {}; E.forEach(x => byC[x.c] = (byC[x.c] || 0) + x.a);
  const byD = {}; E.forEach(x => byD[x.d] = (byD[x.d] || 0) + x.a);
  let h = `<div class="card navy"><div class="now-time">الإجمالي</div><div class="now-big ltr">£${tot.toFixed(2)}</div><div class="muted">≈ <span class="ltr">${(tot * RATE.v).toFixed(0)}</span> ريال · السعر ${RATE.v.toFixed(3)} (${esc(RATE.src)})</div></div>
  <div class="card"><div class="f2"><input class="inp" id="ea" inputmode="decimal" placeholder="المبلغ £"><select class="inp" id="ec">${ECAT.map(c => `<option>${c}</option>`).join('')}</select></div>
   <input class="inp" id="en" placeholder="ملاحظة (اختياري)" style="margin-top:8px"><div class="btns"><button class="btn wide" data-act="eadd">➕ إضافة</button></div>
   <div class="small muted" id="econv"></div></div>`;
  if (E.length) {
    h += `<div class="sec-t">حسب الفئة</div><div class="card"><table class="t">${Object.keys(byC).map(k => `<tr><td>${k}</td><td class="n">£${byC[k].toFixed(2)}</td><td class="n muted">${(byC[k] * RATE.v).toFixed(0)} ر</td></tr>`).join('')}</table></div>`;
    h += `<div class="sec-t">حسب اليوم</div><div class="card"><table class="t">${Object.keys(byD).sort().map(k => `<tr><td>${dayLabel(k)}</td><td class="n">£${byD[k].toFixed(2)}</td></tr>`).join('')}</table></div>`;
    h += `<div class="sec-t">السجل</div><div class="card"><ul class="lst">${E.slice().reverse().map(x => `<li class="row"><span class="pill gray">${x.c}</span><span class="sp small">${esc(x.n || '')} <span class="muted">${dayLabel(x.d)}</span></span><b class="ltr">£${x.a.toFixed(2)}</b><button class="btn sm ghost" data-act="edel" data-id="${x.id}">✕</button></li>`).join('')}</ul></div>
     <div class="btns"><button class="btn sec" data-act="ecsv">📋 نسخ كجدول</button></div>`;
  }
  h += `<div class="sec-t">محوّل سريع</div><div class="card f2"><input class="inp" id="cgbp" inputmode="decimal" placeholder="£ جنيه"><input class="inp" id="csar" inputmode="decimal" placeholder="ريال"></div><div class="muted small">البنوك تضيف عادة 1–3% على سعر السوق.</div>`;
  return h;
}
function secShop() {
  const H = P.cumberland;
  return `<div class="card tip small">مرتّب حسب ما ذكرتموه: يدوي وفريد للزوجة، رجالي فريد لك، هدية الوالد العسكري، الصوف الإنجليزي، العطور، الرضيعة، وهدايا الأهل. التاريخ بجانب كل محل = متى يكون على طريقكم.</div>` +
    SHOP.map(g => `<details class="card" ${g.k.startsWith('لزوجتك') ? 'open' : ''}><summary>${esc(g.k)}</summary>${g.note ? `<div class="small muted" style="margin:6px 0">${esc(g.note)}</div>` : ''}<ul class="lst">${g.items.map(([id, t]) => { const p = P[id]; if (!p) return ''; return `<li><div class="row"><span>${TYPE[p.t][0]}</span><b class="sp">${esc(p.n)}</b><button class="btn sm sec" data-act="place" data-id="${id}">التفاصيل</button></div><div class="small">${esc(t)}</div>${p.tip && /ضريبة/.test(p.tip) ? '<div class="small" style="color:var(--green)">✓ يشحن للخارج بدون ضريبة</div>' : ''}</li>`; }).join('')}</ul></details>`).join('');
}
function secDiscounts() {
  const D = DISCOUNTS;
  return `<div class="sec-t">🚆 بطاقة Two Together — أين تستفيدون فعلاً</div><div class="card"><ul class="lst">${D.railcard.map(r => `<li><div class="row"><span style="font-size:18px">${r[0]}</span><b>${esc(r[1])}</b></div><div class="small muted">${esc(r[2])}</div></li>`).join('')}</ul></div>
  <div class="card small"><b>القواعد:</b><ul style="margin:6px 0;padding-inline-start:18px">${D.rules.map(r => `<li>${esc(r)}</li>`).join('')}</ul></div>
  <div class="sec-t">🎟️ «اثنان بسعر واحد» (Days Out Guide)</div>${D.twoforone.map(x => `<div class="card"><b>${esc(x.w)}</b><div class="small">${esc(x.t)}</div></div>`).join('')}
  <div class="btns"><a class="btn sec wide" href="https://www.daysoutguide.co.uk" target="_blank" rel="noopener">فتح Days Out Guide</a></div>
  <div class="sec-t">🧾 الضريبة (VAT 20%)</div>${D.tax.map(x => `<div class="card ${x.w === 'الخلاصة' ? 'warn' : ''}"><b>${esc(x.w)}</b><div class="small">${esc(x.t)}</div></div>`).join('')}
  <div class="card small"><b>محلات في خطتكم تشحن بدون ضريبة:</b> ${['selfridges', 'liberty', 'fortnum', 'harrods'].map(id => `<a href="#" data-act="place" data-id="${id}">${P[id].n}</a>`).join(' · ')}</div>`;
}
function secBookings() {
  const B = LS.get('bk', {});
  return `<div class="card tip small">حدّدوا ✓ بعد كل حجز. الأهم قبل الوصول: بيت ليتون، شاي العصر، وإبلاغ المعسكر.</div><div class="card"><ul class="lst">${BOOKINGS.map(b => `<li class="row"><button class="chk ${B[b.id] ? 'on' : ''}" data-act="bk" data-id="${b.id}">${B[b.id] ? '✓' : ''}</button><div class="sp"><b>${esc(b.t)}</b><div class="small muted">${esc(b.when)}</div></div>${b.u ? `<a class="btn sm sec" href="${esc(b.u)}" target="_blank" rel="noopener">فتح</a>` : ''}</li>`).join('')}</ul></div>`;
}
function secGuide() { return GUIDE.map((g, i) => `<details class="card" ${i === 0 ? 'open' : ''}><summary>${esc(g.k)}</summary><div class="small" style="white-space:pre-line;margin-top:6px">${esc(g.t)}</div></details>`).join(''); }

// ====================== المساعد الذكي ======================
const CHAT = LS.get('chat', []);
function aiContext(question) {
  const { day, cur, next } = currentItems(); const L = lon(); const o = originNow();
  const plan = (day || DAYS[0]).items.map(it => `${it.s}-${it.e} ${it.ti}${it.meal ? ' [خيارات: ' + it.meal.opts.map(id => P[id] && P[id].en).join(', ') + ']' : ''}`).join('\n');
  const near = nearby(o, { r: 1600, limit: 25 }).map(x => `${x.p.en || x.p.n} | ${TYPE[x.p.t][1]} | ${Math.round(x.m)}م${x.p.h ? ' | ' + HAL[x.p.h][0] : ''}${x.p.f ? ' | صديقه ' + FR[x.p.f].r : ''}`).join('\n');
  const np = nextPrayer(); const w = hoursTxt();
  return `أنت مساعد رحلة لعائلة سعودية في بريطانيا. أجب بالعربية باختصار عملي: 2–3 خيارات، مع المسافة وطريقة الوصول والمبرر المناسب لذوقهم. لا تخترع معلومات؛ إن لم تكن متأكداً قل ذلك.

ملف العائلة:
${PROFILE}

الوقت الآن في لندن: ${L.ds} ${String(L.h).padStart(2, '0')}:${String(L.mi).padStart(2, '0')}
اليوم: ${day ? day.w + ' ' + day.dn + ' — ' + day.h + ' (' + CITY[day.c].n + ')' : 'قبل/بعد الرحلة'}
الآن: ${cur ? cur.ti : '—'} | القادم: ${next ? next.s + ' ' + next.ti : '—'}
الموقع المرجعي: ${o.src} (${o.lat.toFixed(4)}, ${o.lng.toFixed(4)})
الصلاة القادمة: ${np ? PRN[np.k] + ' ' + fmtT(np.at) : '—'}
الطقس القادم: ${w}

خطة اليوم:
${plan}

أماكن قريبة من قائمتنا (الاسم | النوع | المسافة | الحلال | تقييم صديقه):
${near}

سؤالي: ${question}`;
}
function hoursTxt() { const d = todayDay(); const c = d ? d.c : 'L'; const hs = wxHours(c, lon().ds, lon().h, 5); return hs.length ? hs.map(x => `${x.h}:00 ${x.t}° مطر${x.pp}% رياح${x.g}`).join('، ') : 'غير متوفر'; }
function secAssistant() {
  const key = LS.get('key', '');
  let h = `<div class="card small">${key ? '✅ وضع Claude مفعّل بمفتاحك (يُحفظ على هذا الجوال فقط).' : 'بدون مفتاح API: استخدم الأزرار السريعة في شاشة «الآن»، أو اكتب سؤالك هنا واضغط «انسخ وافتح Claude» — سأنسخ لك سؤالك مع خطة يومك وموقعك والأماكن القريبة لتلصقه في تطبيق Claude. لتفعيل الرد هنا مباشرة أضف مفتاحك من «الإعدادات».'}</div>
  <div class="chat" id="chatlog" style="max-height:46vh;overflow:auto">${CHAT.map(m => `<div class="msg ${m.r === 'user' ? 'u' : 'a'}">${esc(m.c)}</div>`).join('') || '<div class="muted small">أمثلة: «تعبنا ونحن قرب البرج، ما الأقرب للجلوس؟» · «بدّل عشاء الليلة بمكان فاخر حلال» · «الجو ممطر، ماذا نفعل بدل بورتوبيللو؟»</div>'}</div>
  <textarea class="inp" id="aiq" rows="3" placeholder="اكتب سؤالك…" style="margin-top:10px"></textarea>
  <div class="btns">${key ? '<button class="btn" data-act="aisend">إرسال</button>' : ''}<button class="btn ${key ? 'sec' : ''}" data-act="aicopy">📋 انسخ وافتح Claude</button>${CHAT.length ? '<button class="btn ghost" data-act="aiclear">مسح المحادثة</button>' : ''}</div>`;
  return h;
}
async function aiSend() {
  const q = $('#aiq').value.trim(); if (!q) return;
  const key = LS.get('key', ''), model = LS.get('model', 'claude-sonnet-5-5');
  const ctx = aiContext(q);
  CHAT.push({ r: 'user', c: q }); LS.set('chat', CHAT.slice(-20));
  openSection('assistant'); $('#chatlog').insertAdjacentHTML('beforeend', '<div class="msg a" id="aiwait">…يفكر</div>'); $('#chatlog').scrollTop = 1e6;
  const hist = CHAT.slice(-9, -1).map(m => ({ role: m.r === 'user' ? 'user' : 'assistant', content: m.c }));
  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST', headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model, max_tokens: 900, messages: [...hist, { role: 'user', content: ctx }] })
    });
    const d = await r.json();
    if (!r.ok) throw new Error((d && d.error && d.error.message) || ('HTTP ' + r.status));
    const txt = (d.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n').trim() || '(لا رد)';
    CHAT.push({ r: 'assistant', c: txt }); LS.set('chat', CHAT.slice(-20));
  } catch (e) { CHAT.push({ r: 'assistant', c: 'تعذّر الاتصال: ' + e.message + '\nتأكد من المفتاح والاتصال، أو استخدم «انسخ وافتح Claude».' }); }
  openSection('assistant');
}
function secSettings() {
  const key = LS.get('key', ''), model = LS.get('model', 'claude-sonnet-5-5');
  return `<div class="card"><b>مفتاح Claude API (اختياري)</b><div class="small muted">يُحفظ على هذا الجوال فقط ويُرسل مباشرة إلى Anthropic. الاستخدام مدفوع حسب الاستهلاك من حسابك في console.anthropic.com — ضع حداً للإنفاق هناك.</div>
    <input class="inp" id="skey" type="password" placeholder="sk-ant-…" value="${esc(key)}" style="margin-top:8px">
    <select class="inp" id="smodel" style="margin-top:8px"><option value="claude-sonnet-5-5" ${model === 'claude-sonnet-5-5' ? 'selected' : ''}>Claude Sonnet 5.5 (أذكى)</option><option value="claude-haiku-5-5" ${model === 'claude-haiku-5-5' ? 'selected' : ''}>Claude Haiku 5.5 (أسرع وأرخص)</option></select>
    <div class="btns"><button class="btn" data-act="skey">حفظ</button>${key ? '<button class="btn ghost" data-act="skeydel">حذف المفتاح</button>' : ''}</div></div>
  <div class="card"><b>نقل البيانات لجوال زوجتك</b><div class="small muted">ينسخ رمزاً فيه: ✓ الخطة، الحجوزات، المصاريف. الصقه في جوالها هنا واضغط «استيراد».</div>
    <div class="btns"><button class="btn sec" data-act="exp">📋 نسخ رمز المزامنة</button></div>
    <textarea class="inp" id="impt" rows="2" placeholder="الصق الرمز هنا" style="margin-top:8px"></textarea><div class="btns"><button class="btn sec" data-act="imp">⬇️ استيراد (دمج)</button></div></div>
  <div class="card"><b>تجربة الوقت (للمعاينة)</b><div class="small muted">اعرض التطبيق كأنك في وقت معيّن من الرحلة (بتوقيت لندن).</div>
    <input class="inp ltr" id="simt" type="datetime-local" value="2026-11-13T10:00" style="margin-top:8px;width:100%"><div class="btns"><button class="btn sec" data-act="simset">تطبيق</button><button class="btn ghost" data-act="sim-off">الوقت الحقيقي</button></div></div>
  <div class="card"><button class="btn ghost wide" data-act="reset">مسح كل بياناتي من هذا الجوال</button></div>`;
}

// ====================== التنقل والأحداث ======================
let TAB = LS.get('tab', 'now');
function showTab(t) {
  TAB = t; LS.set('tab', t);
  $$('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + t));
  $$('.nav button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  ({ now: renderNow, plan: renderPlan, map: renderMap, places: renderPlaces, more: renderMore })[t]();
  window.scrollTo(0, 0);
}
function renderHeader() {
  const L = lon(), d = todayDay(), ph = tripPhase();
  $('#hclock').innerHTML = `<b>${String(L.h).padStart(2, '0')}:${String(L.mi).padStart(2, '0')}</b>لندن${d && wxShort(d.c) ? ' · ' + wxShort(d.c) : ''}`;
  $('#hsub').textContent = ph === 'before' ? 'قبل السفر — 12 إلى 22 نوفمبر' : ph === 'after' ? 'انتهت الرحلة' : `${d.w} ${d.dn} · ${CITY[d.c].n}`;
}
function wxShort(c) { const hs = wxHours(c, lon().ds, lon().h, 1); return hs.length ? `${wcode(hs[0].code)[0]} ${hs[0].t}°` : ''; }
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  if (t.tagName === 'A' && t.getAttribute('href') === '#') e.preventDefault();
  switch (a) {
    case 'tab': closeSheet(); showTab(t.dataset.t); break;
    case 'place': openPlace(t.dataset.id); break;
    case 'day': PLAN_DAY = t.dataset.d; renderPlan(); break;
    case 'goday': PLAN_DAY = t.dataset.d; closeSheet(); showTab('plan'); break;
    case 'mapday': MDAY = t.dataset.d; MF = 'day'; showTab('map'); break;
    case 'done': { const k = t.dataset.k; DONE.has(k) ? DONE.delete(k) : DONE.add(k); LS.set('done', [...DONE]); TAB === 'plan' ? renderPlan() : renderNow(); break; }
    case 'sec': openSection(t.dataset.s); break;
    case 'qa': quick(t.dataset.q); break;
    case 'pf': { const k = t.dataset.k; if (k === 'fr' || k === 'hal') PF[k] = !PF[k]; else PF[k] = t.dataset.v; LS.set('pf', PF); renderPlaces(); break; }
    case 'mf': MF = t.dataset.v; renderMap(); break;
    case 'mapcity': { const c = CITY[t.dataset.c]; MF = MF === 'day' ? 'all' : MF; renderMap(); MAP && MAP.setView([c.lat, c.lng], c.z); break; }
    case 'locate': getPos(p => { if (p) { toast('تم تحديد موقعك'); if (TAB === 'map') { renderMap(); MAP.setView([p.lat, p.lng], 16); } if (TAB === 'places') renderPlaces(); } }); break;
    case 'wxc': WXSEL = t.dataset.c; loadWx(WXSEL).then(() => openSection('weather')); openSection('weather'); break;
    case 'wxr': loadWx(WXSEL, true).then(() => { openSection('weather'); toast('تم التحديث'); }); break;
    case 'prc': PRSEL = { c: t.dataset.c, d: t.dataset.d }; openSection('prayer'); break;
    case 'eadd': { const v = parseFloat(($('#ea').value || '').replace(',', '.')); if (!(v > 0)) { toast('اكتب المبلغ'); break; } const E = LS.get('exp', []); E.push({ id: Date.now(), a: v, c: $('#ec').value, n: $('#en').value.trim(), d: lon().ds }); LS.set('exp', E); openSection('expenses'); toast('أُضيف ✓'); break; }
    case 'edel': { LS.set('exp', LS.get('exp', []).filter(x => String(x.id) !== t.dataset.id)); openSection('expenses'); break; }
    case 'ecsv': copyText('التاريخ,الفئة,المبلغ £,بالريال,ملاحظة\n' + LS.get('exp', []).map(x => `${x.d},${x.c},${x.a.toFixed(2)},${(x.a * RATE.v).toFixed(0)},${(x.n || '').replace(/,/g, ' ')}`).join('\n')); break;
    case 'bk': { const B = LS.get('bk', {}); B[t.dataset.id] = !B[t.dataset.id]; LS.set('bk', B); openSection('bookings'); break; }
    case 'aisend': aiSend(); break;
    case 'aicopy': { const q = ($('#aiq') && $('#aiq').value.trim()) || 'ماذا تقترح الآن؟'; copyText(aiContext(q)).then(() => { setTimeout(() => window.open('https://claude.ai/new', '_blank'), 400); }); break; }
    case 'aiclear': CHAT.length = 0; LS.set('chat', []); openSection('assistant'); break;
    case 'skey': LS.set('key', $('#skey').value.trim()); LS.set('model', $('#smodel').value); toast('حُفظ'); openSection('settings'); break;
    case 'skeydel': LS.set('key', ''); toast('حُذف المفتاح'); openSection('settings'); break;
    case 'exp': copyText(btoa(unescape(encodeURIComponent(JSON.stringify({ done: [...DONE], bk: LS.get('bk', {}), exp: LS.get('exp', []) }))))); break;
    case 'imp': { try { const d = JSON.parse(decodeURIComponent(escape(atob($('#impt').value.trim())))); (d.done || []).forEach(k => DONE.add(k)); LS.set('done', [...DONE]); LS.set('bk', Object.assign(LS.get('bk', {}), d.bk || {})); const E = LS.get('exp', []), ids = new Set(E.map(x => x.id)); (d.exp || []).forEach(x => { if (!ids.has(x.id)) E.push(x); }); LS.set('exp', E); toast('تم الاستيراد ✓'); } catch (_) { toast('الرمز غير صالح'); } break; }
    case 'simset': { const v = $('#simt').value; if (v) { LS.set('sim', v); location.reload(); } break; }
    case 'sim-off': LS.set('sim', ''); location.href = location.pathname; break;
    case 'reset': if (window.confirm ? confirm('مسح كل البيانات؟') : true) { Object.keys(localStorage).filter(k => k.startsWith('lt_')).forEach(k => localStorage.removeItem(k)); location.reload(); } break;
    case 'close': closeSheet(); break;
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'cgbp') { const v = parseFloat(e.target.value); $('#csar').value = v ? (v * RATE.v).toFixed(2) : ''; }
  if (e.target.id === 'csar') { const v = parseFloat(e.target.value); $('#cgbp').value = v ? (v / RATE.v).toFixed(2) : ''; }
  if (e.target.id === 'ea') { const v = parseFloat(e.target.value); $('#econv').textContent = v ? `≈ ${(v * RATE.v).toFixed(0)} ريال` : ''; }
});
$('#sheet-bg').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

// ====================== التشغيل ======================
function boot() {
  $$('.nav button').forEach(b => b.addEventListener('click', () => { closeSheet(); showTab(b.dataset.t); }));
  renderHeader(); showTab(TAB);
  const cs = [...new Set(DAYS.map(d => d.c))];
  Promise.all(cs.map(c => loadWx(c))).then(() => { renderHeader(); if (TAB === 'now') renderNow(); if (TAB === 'plan') renderPlan(); });
  loadRate();
  setInterval(() => { renderHeader(); if (TAB === 'now' && !$('#sheet').classList.contains('on')) renderNow(); }, 30000);
}
boot();

</script>
